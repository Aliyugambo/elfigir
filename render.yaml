services:
  - type: web
    name: elfigir-frontend
    region: Oregon
    runtime: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://your-backend-url.onrender.com/api/v1
      - key: NEXT_PUBLIC_APP_NAME
        value: Elfigir
    deployCommand: npm run build
    healthCheckPath: /